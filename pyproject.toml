[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disasterbridge"
version = "1.0.0"
description = "Damage-adaptive post-disaster SAR synthesis via bridge diffusion for all-weather building damage assessment"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Chunfang Wan"},
  {name = "Haonan Guo"},
  {name = "Xin Su"},
  {name = "Zaiyan Zhang"},
  {name = "Li Zheng"},
  {name = "Qiangqiang Yuan"},
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "tifffile>=2023.2",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.urls]
Repository = "https://github.com/chunnn26/DisasterBridge"

[tool.setuptools.packages.find]
include = ["disasterbridge*"]
